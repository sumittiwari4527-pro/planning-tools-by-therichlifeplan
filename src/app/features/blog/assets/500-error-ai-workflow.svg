<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="32" fill="#0f1523"/><g font-family="Arial,sans-serif"><text x="70" y="80" font-size="38" font-weight="700" fill="#fff">Website returns 500. What does the AI need?</text><rect x="70" y="145" width="220" height="230" rx="22" fill="#fff"/><text x="105" y="195" font-size="28" font-weight="700" fill="#dc2626">500</text><text x="105" y="235" font-size="20" font-weight="700" fill="#0f1523">Internal Server</text><text x="105" y="263" font-size="20" font-weight="700" fill="#0f1523">Error</text><text x="105" y="315" font-size="16" fill="#6b7a99">The symptom</text><path d="M310 260 H385" stroke="#94a3b8" stroke-width="5"/><path d="M375 248 L390 260 L375 272" fill="#94a3b8"/><rect x="410" y="145" width="170" height="230" rx="22" fill="#eef0fd"/><text x="445" y="195" font-size="24" font-weight="700" fill="#4f46e5">SKILL</text><text x="445" y="235" font-size="17" fill="#0f1523">Follow the</text><text x="445" y="260" font-size="17" fill="#0f1523">diagnosis steps</text><path d="M600 260 H675" stroke="#94a3b8" stroke-width="5"/><path d="M665 248 L680 260 L665 272" fill="#94a3b8"/><rect x="700" y="145" width="170" height="230" rx="22" fill="#ecfeff"/><text x="735" y="195" font-size="24" font-weight="700" fill="#0891b2">MCP</text><text x="735" y="235" font-size="17" fill="#0f1523">Access logs,</text><text x="735" y="260" font-size="17" fill="#0f1523">metrics, tools</text><path d="M890 260 H965" stroke="#94a3b8" stroke-width="5"/><path d="M955 248 L970 260 L955 272" fill="#94a3b8"/><rect x="990" y="145" width="140" height="230" rx="22" fill="#ecfdf5"/><text x="1020" y="195" font-size="24" font-weight="700" fill="#059669">RAG</text><text x="1020" y="235" font-size="16" fill="#0f1523">Find the</text><text x="1020" y="260" font-size="16" fill="#0f1523">right runbook</text><text x="70" y="440" font-size="19" fill="#cbd5e1">Memory can add the final context: “This service was migrated last week.”</text><text x="70" y="475" font-size="18" fill="#94a3b8">Together, they turn a vague error into a structured troubleshooting workflow.</text></g></svg>