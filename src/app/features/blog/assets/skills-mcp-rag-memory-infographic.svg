<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="32" fill="#f8f9fb"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#0f1523">One AI task. Four different jobs.</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="21" fill="#6b7a99">A simple mental model for Skills, MCP, RAG and Memory</text><g font-family="Arial,sans-serif"><rect x="70" y="180" width="250" height="390" rx="24" fill="#eef0fd" stroke="#cfd3f7"/><text x="100" y="235" font-size="30" font-weight="700" fill="#4f46e5">SKILL</text><text x="100" y="285" font-size="24" font-weight="700" fill="#0f1523">The recipe</text><text x="100" y="325" font-size="18" fill="#48536b">How should the AI</text><text x="100" y="350" font-size="18" fill="#48536b">perform the job?</text><text x="100" y="420" font-size="17" fill="#0f1523">Example:</text><text x="100" y="448" font-size="17" fill="#48536b">“Follow these steps</text><text x="100" y="474" font-size="17" fill="#48536b">to diagnose a 500.”</text><rect x="350" y="180" width="250" height="390" rx="24" fill="#ecfeff" stroke="#bfecef"/><text x="380" y="235" font-size="30" font-weight="700" fill="#0891b2">MCP</text><text x="380" y="285" font-size="24" font-weight="700" fill="#0f1523">The hands</text><text x="380" y="325" font-size="18" fill="#48536b">How can the AI</text><text x="380" y="350" font-size="18" fill="#48536b">use external tools?</text><text x="380" y="420" font-size="17" fill="#0f1523">Example:</text><text x="380" y="448" font-size="17" fill="#48536b">“Read the server logs</text><text x="380" y="474" font-size="17" fill="#48536b">through a tool.”</text><rect x="630" y="180" width="250" height="390" rx="24" fill="#ecfdf5" stroke="#c6f0dd"/><text x="660" y="235" font-size="30" font-weight="700" fill="#059669">RAG</text><text x="660" y="285" font-size="24" font-weight="700" fill="#0f1523">The library</text><text x="660" y="325" font-size="18" fill="#48536b">Where can the AI</text><text x="660" y="350" font-size="18" fill="#48536b">find relevant knowledge?</text><text x="660" y="420" font-size="17" fill="#0f1523">Example:</text><text x="660" y="448" font-size="17" fill="#48536b">“Find the runbook for</text><text x="660" y="474" font-size="17" fill="#48536b">this error.”</text><rect x="910" y="180" width="220" height="390" rx="24" fill="#fff7ed" stroke="#fed7aa"/><text x="940" y="235" font-size="30" font-weight="700" fill="#ea580c">MEMORY</text><text x="940" y="285" font-size="24" font-weight="700" fill="#0f1523">The notebook</text><text x="940" y="325" font-size="18" fill="#48536b">What useful facts</text><text x="940" y="350" font-size="18" fill="#48536b">should persist?</text><text x="940" y="420" font-size="17" fill="#0f1523">Example:</text><text x="940" y="448" font-size="17" fill="#48536b">“This site uses</text><text x="940" y="474" font-size="17" fill="#48536b">Node + PostgreSQL.”</text><text x="70" y="635" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#0f1523">Shortcut: Recipe → Hands → Library → Notebook</text></g></svg>