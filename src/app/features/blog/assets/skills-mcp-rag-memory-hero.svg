<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Skills, MCP, RAG and Memory</title>
  <desc id="desc">A visual showing four complementary layers of an AI workflow: Skill, MCP, RAG and Memory.</desc>
  <rect width="1200" height="675" rx="36" fill="#0f1523"/>
  <circle cx="1040" cy="90" r="180" fill="#1f2937" opacity="0.65"/>
  <circle cx="1080" cy="600" r="220" fill="#12352d" opacity="0.55"/>
  <text x="72" y="92" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#a7f3d0">AI CONCEPTS</text>
  <text x="72" y="160" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Four layers. One smarter workflow.</text>
  <text x="72" y="204" font-family="Arial,sans-serif" font-size="22" fill="#cbd5e1">Understand what Skills, MCP, RAG and Memory each bring to an AI system.</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="280" width="246" height="270" rx="26" fill="#eef0fd"/>
    <text x="102" y="338" font-size="30" font-weight="700" fill="#4f46e5">SKILL</text>
    <text x="102" y="384" font-size="25" font-weight="700" fill="#0f1523">The recipe</text>
    <text x="102" y="430" font-size="18" fill="#48536b">How the AI should</text>
    <text x="102" y="456" font-size="18" fill="#48536b">perform the job.</text>
    <rect x="338" y="280" width="246" height="270" rx="26" fill="#ecfeff"/>
    <text x="368" y="338" font-size="30" font-weight="700" fill="#0891b2">MCP</text>
    <text x="368" y="384" font-size="25" font-weight="700" fill="#0f1523">The hands</text>
    <text x="368" y="430" font-size="18" fill="#48536b">How the AI can use</text>
    <text x="368" y="456" font-size="18" fill="#48536b">external tools.</text>
    <rect x="604" y="280" width="246" height="270" rx="26" fill="#ecfdf5"/>
    <text x="634" y="338" font-size="30" font-weight="700" fill="#059669">RAG</text>
    <text x="634" y="384" font-size="25" font-weight="700" fill="#0f1523">The library</text>
    <text x="634" y="430" font-size="18" fill="#48536b">Where the AI finds</text>
    <text x="634" y="456" font-size="18" fill="#48536b">relevant knowledge.</text>
    <rect x="870" y="280" width="258" height="270" rx="26" fill="#fff7ed"/>
    <text x="900" y="338" font-size="30" font-weight="700" fill="#ea580c">MEMORY</text>
    <text x="900" y="384" font-size="25" font-weight="700" fill="#0f1523">The notebook</text>
    <text x="900" y="430" font-size="18" fill="#48536b">What useful context</text>
    <text x="900" y="456" font-size="18" fill="#48536b">should persist.</text>
  </g>
  <text x="72" y="620" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#e2e8f0">Recipe → Hands → Library → Notebook</text>
</svg>
