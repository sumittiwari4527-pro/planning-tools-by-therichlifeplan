<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT automation workflow</title>
  <desc id="desc">An original four-step workflow showing Prompt, Connect, Act, and Result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0fd"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1f2937" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="42" fill="url(#bg)"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f1523">The simple automation loop</text>
  <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7a99">Give ChatGPT a clear goal, the right context, and permission to act.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="230" height="230" rx="28" fill="#ffffff"/>
    <rect x="350" y="220" width="230" height="230" rx="28" fill="#ffffff"/>
    <rect x="630" y="220" width="230" height="230" rx="28" fill="#ffffff"/>
    <rect x="910" y="220" width="230" height="230" rx="28" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="185" cy="290" r="34" fill="#4f46e5"/><text x="185" y="301" font-size="26" font-weight="700" fill="#fff">1</text>
    <text x="185" y="360" font-size="25" font-weight="700" fill="#0f1523">Prompt</text>
    <text x="185" y="395" font-size="16" fill="#6b7a99">State the outcome</text>
    <text x="185" y="420" font-size="16" fill="#6b7a99">and constraints.</text>

    <circle cx="465" cy="290" r="34" fill="#0891b2"/><text x="465" y="301" font-size="26" font-weight="700" fill="#fff">2</text>
    <text x="465" y="360" font-size="25" font-weight="700" fill="#0f1523">Connect</text>
    <text x="465" y="395" font-size="16" fill="#6b7a99">Choose the plugin</text>
    <text x="465" y="420" font-size="16" fill="#6b7a99">and approved app.</text>

    <circle cx="745" cy="290" r="34" fill="#059669"/><text x="745" y="301" font-size="26" font-weight="700" fill="#fff">3</text>
    <text x="745" y="360" font-size="25" font-weight="700" fill="#0f1523">Act</text>
    <text x="745" y="395" font-size="16" fill="#6b7a99">Let it search, create,</text>
    <text x="745" y="420" font-size="16" fill="#6b7a99">or update when allowed.</text>

    <circle cx="1025" cy="290" r="34" fill="#d97706"/><text x="1025" y="301" font-size="26" font-weight="700" fill="#fff">4</text>
    <text x="1025" y="360" font-size="25" font-weight="700" fill="#0f1523">Result</text>
    <text x="1025" y="395" font-size="16" fill="#6b7a99">Review the output</text>
    <text x="1025" y="420" font-size="16" fill="#6b7a99">before moving on.</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M305 335h35l-12-12m12 12-12 12"/>
    <path d="M585 335h35l-12-12m12 12-12 12"/>
    <path d="M865 335h35l-12-12m12 12-12 12"/>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4f46e5">Human-in-the-loop: approve important actions and verify the result.</text>
</svg>
